name: ai_chatbot
description: A simple AI Chatbot using Flutter and Gemini API.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^5.2.1
  flutter_markdown: ^0.7.7+1
  google_fonts: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env